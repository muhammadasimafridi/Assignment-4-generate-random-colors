<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Color Changer</title>
    <style>
        *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }
    h1{
        margin: 30px 0 10px 0;
        font-weight: 900;
        font-size: 35px;
        margin-top: 35vh;
    }
    button{
        padding: 10px 50px;
    }
    </style>
</head>
<body>
    <h1>Random Color Changer</h1>
    <button>Generate Random Color</button>
    <h2>rgb(255, 255, 255)</h2>

    <script>
        let btn = document.querySelector("button");
        let body = document.querySelector("body");
        let h2 = document.querySelector("h2");

        btn.addEventListener("click", () => {
            let redColor = Math.floor(Math.random() * 255);
            let greenColor = Math.floor(Math.random() * 255);
            let blueColor = Math.floor(Math.random() * 255);

            body.style.backgroundColor = `rgb(${redColor}, ${greenColor}, ${blueColor})`;

            h2.textContent = `rgb(${redColor}, ${greenColor}, ${blueColor})`;
        });
    </script>
</body>
</html>
